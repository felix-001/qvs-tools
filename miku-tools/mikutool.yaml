acc:
  lc_chan_bufsize: 16000
  lc_duration_ms: 5000
  lc_expires_ms: 600000
  master:
    default:
      fail_retry_interval_s: 10
      hosts:
      - https://confg.qbox.me
  mc_rw_timeout_ms: 100
bw_ratio_config:
  东北:
    total: 0.08
  华东:
    total: 0.2
  华中:
    total: 0.15
  华北:
    total: 0.12
  华南:
    total: 0.18
  西北:
    total: 0.06
  西南:
    total: 0.05
dnspod:
  domains: []
  skip_record_type:
  - A
  - CNAME
  task_pool_size: 50
